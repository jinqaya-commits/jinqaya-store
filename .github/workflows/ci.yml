name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - test/paypal-payment-contracts
      - feat/checkout-shipping-country-rules

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Lint changed checkout application files
        run: npx eslint src/app/api/checkout/route.ts src/app/checkout/checkout-form.tsx

      - name: Check TypeScript
        run: npx tsc --noEmit
