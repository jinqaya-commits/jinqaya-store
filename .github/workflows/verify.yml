name: Verify application

on:
  push:
    branches: [main, release/order-status-lookup]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      # Lint the files in this release. The existing main branch has unrelated
      # lint errors in legacy admin/storefront files; do not expand this release
      # into unrelated cleanup work.
      - name: Lint order status release files
        run: >-
          npx eslint
          src/app/api/order-status/request-code/route.ts
          src/app/api/order-status/route.ts
          src/app/api/order-status/verify/route.ts
          src/app/order-status/order-status-lookup.tsx
          src/app/order-status/page.tsx
          src/lib/order-email.ts
          src/lib/order-status-security.ts
          src/types/database.ts
          src/components/storefront/category-navigation.tsx

      - name: Security unit tests
        run: npm test

      - name: Production build
        run: npm run build

  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jinqaya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jinqaya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Execute order status migration and integration tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: jinqaya_test
        run: psql -v ON_ERROR_STOP=1 -f tests/order-status-postgres-integration.sql

      - name: Test concurrent order status verification
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: jinqaya_test
        run: bash tests/order-status-postgres-concurrency.sh
