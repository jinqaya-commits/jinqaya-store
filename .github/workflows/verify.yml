name: Verify application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        id: install
        run: npm install

      - name: Type-check
        id: typecheck
        run: npx tsc --noEmit

      - name: Lint changed files
        id: lint
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            DIFF_RANGE="origin/$BASE_REF...HEAD"
          else
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              DIFF_RANGE=""
            else
              DIFF_RANGE="$BASE_SHA $HEAD_SHA"
            fi
          fi

          if [ -n "$DIFF_RANGE" ]; then
            mapfile -t FILES < <(git diff --name-only $DIFF_RANGE --diff-filter=ACMRT | grep -E '\.(js|jsx|ts|tsx|mjs|cjs)$' || true)
          else
            mapfile -t FILES < <(git ls-files | grep -E '\.(js|jsx|ts|tsx|mjs|cjs)$' || true)
          fi

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed JavaScript or TypeScript files to lint."
          else
            printf 'Linting changed files:\n%s\n' "${FILES[@]}"
            npx eslint "${FILES[@]}"
          fi

      - name: Production build
        id: build
        if: always() && steps.install.outcome == 'success' && steps.typecheck.outcome == 'success'
        run: npm run build
