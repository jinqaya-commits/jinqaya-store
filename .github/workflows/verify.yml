name: Verify application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate CLI-generated migration filename
        run: |
          migration_file="supabase/migrations/20261111100000_release_expired_stock_reservations.sql"
          test -f "$migration_file"
          [[ "$(basename "$migration_file")" =~ ^[0-9]{14}_release_expired_stock_reservations\.sql$ ]]

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse migration SQL
        run: |
          python -m pip install --disable-pip-version-check pglast==8.7
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          path = Path("supabase/migrations/20261111100000_release_expired_stock_reservations.sql")
          statements = parse_sql(path.read_text())
          if not statements:
              raise SystemExit("Migration contains no SQL statements")
          print(f"PostgreSQL parser accepted {len(statements)} statements in {path}")
          PY


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        id: install
        run: npm install

      - name: Type-check
        id: typecheck
        run: npx tsc --noEmit

      - name: Lint changed files
        id: lint
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            DIFF_RANGE="origin/$BASE_REF...HEAD"
          else
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              DIFF_RANGE=""
            else
              DIFF_RANGE="$BASE_SHA $HEAD_SHA"
            fi
          fi

          if [ -n "$DIFF_RANGE" ]; then
            mapfile -t FILES < <(git diff --name-only $DIFF_RANGE --diff-filter=ACMRT | grep -E '\.(js|jsx|ts|tsx|mjs|cjs)$' || true)
          else
            mapfile -t FILES < <(git ls-files | grep -E '\.(js|jsx|ts|tsx|mjs|cjs)$' || true)
          fi

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed JavaScript or TypeScript files to lint."
          else
            printf 'Linting changed files:\n%s\n' "${FILES[@]}"
            npx eslint "${FILES[@]}"
          fi

      - name: Production build
        id: build
        if: always() && steps.install.outcome == 'success' && steps.typecheck.outcome == 'success'
        env:
          # CI uses inert placeholders so storefront pages can prerender without production credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder-key
        run: npm run build
