name: Verify application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate CLI-generated migration filename
        run: |
          migration_file="supabase/migrations/20261111100000_release_expired_stock_reservations.sql"
          test -f "$migration_file"
          [[ "$(basename "$migration_file")" =~ ^[0-9]{14}_release_expired_stock_reservations\.sql$ ]]

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse migration SQL
        run: |
          python -m pip install --disable-pip-version-check pglast==8.7
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          path = Path("supabase/migrations/20261111100000_release_expired_stock_reservations.sql")
          statements = parse_sql(path.read_text())
          if not statements:
              raise SystemExit("Migration contains no SQL statements")
          print(f"PostgreSQL parser accepted {len(statements)} statements in {path}")
          PY


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        id: install
        run: npm install

      - name: Type-check
        id: typecheck
        run: npx tsc --noEmit

      - name: Lint changed files
        id: lint
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            DIFF_RANGE="origin/$BASE_REF...HEAD"
          else
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              DIFF_RANGE=""
            else
              DIFF_RANGE="$BASE_SHA $HEAD_SHA"
            fi
          fi

          if [ -n "$DIFF_RANGE" ]; then
            mapfile -t FILES < <(git diff --name-only $DIFF_RANGE --diff-filter=ACMRT | grep -E '\.(js|jsx|ts|tsx|mjs|cjs)$' || true)
          else
            mapfile -t FILES < <(git ls-files | grep -E '\.(js|jsx|ts|tsx|mjs|cjs)$' || true)
          fi

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed JavaScript or TypeScript files to lint."
          else
            printf 'Linting changed files:\n%s\n' "${FILES[@]}"
            npx eslint "${FILES[@]}"
          fi

      - name: Security unit tests
        run: npm test

      - name: Production build
        id: build
        if: always() && steps.install.outcome == 'success' && steps.typecheck.outcome == 'success'
        env:
          # CI uses inert placeholders so storefront pages can prerender without production credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder-key
        run: npm run build

  order-status-database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jinqaya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jinqaya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Execute order status migration and integration tests
        run: |
          container_id="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          python3 - <<'PY' > /tmp/order-status-integration.sql
          from pathlib import Path
          sql = Path("tests/order-status-postgres-integration.sql").read_text()
          for name in (
              "20261108173549_customer_order_status_lookup.sql",
              "20261110035728_order_status_email_retry.sql",
          ):
              marker = f"\\ir ../supabase/migrations/{name}"
              sql = sql.replace(marker, Path("supabase/migrations", name).read_text())
          print(sql)
          PY
          docker exec -i "$container_id" psql -U postgres -d jinqaya_test -v ON_ERROR_STOP=1 < /tmp/order-status-integration.sql

      - name: Test legacy product image cleanup migration
        run: |
          container_id="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          python3 - <<'PY' > /tmp/product-image-cleanup-migration.sql
          from pathlib import Path
          sql = Path("tests/product-image-cleanup-migration.sql").read_text()
          marker = "\\\\ir ../supabase/migrations/202611120001_product_image_cleanup_queue.sql"
          migration = Path("supabase/migrations/202611120001_product_image_cleanup_queue.sql").read_text()
          if marker not in sql:
              raise SystemExit("Migration include marker not found")
          print(sql.replace(marker, migration))
          PY
          docker exec -i "$container_id" psql -U postgres -d jinqaya_test -v ON_ERROR_STOP=1 < /tmp/product-image-cleanup-migration.sql

      - name: Test concurrent order status verification
        run: bash tests/order-status-postgres-concurrency.sh
